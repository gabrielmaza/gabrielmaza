<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="190" viewBox="0 0 1280 190" fill="none">
  <defs>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9B6FF"/>
      <stop offset="1" stop-color="#5EE7FF"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E2DE2"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      .card { opacity: 0; animation: in .8s ease-out forwards; }
      .c1 { animation-delay: .1s } .c2 { animation-delay: .3s } .c3 { animation-delay: .5s } .c4 { animation-delay: .7s }
      @keyframes in { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
      .grow { animation: grow 1.4s ease-out forwards; transform-box: fill-box; transform-origin: left; transform: scaleX(0); }
      @keyframes grow { to { transform: scaleX(1) } }
    </style>
  </defs>

  <g class="sans">
    <g class="card c1">
      <rect x="1" y="1" width="302" height="186" rx="22" fill="#0F0F1C" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="32" y="86" font-size="56" font-weight="800" fill="url(#num)" letter-spacing="-1">10+</text>
      <text x="32" y="124" font-size="17" font-weight="600" fill="#FFFFFF">years shipping for the web</text>
      <text x="32" y="150" font-size="14" fill="#9A9AB5">Frontend since 2014</text>
      <rect class="grow" x="32" y="166" width="120" height="4" rx="2" fill="url(#bar)"/>
    </g>
    <g class="card c2">
      <rect x="326" y="1" width="302" height="186" rx="22" fill="#0F0F1C" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="357" y="86" font-size="56" font-weight="800" fill="url(#num)" letter-spacing="-1">95M</text>
      <text x="357" y="124" font-size="17" font-weight="600" fill="#FFFFFF">monthly visits</text>
      <text x="357" y="150" font-size="14" fill="#9A9AB5">NFL.com · Core Web Vitals &amp; a11y</text>
      <rect class="grow" x="357" y="166" width="120" height="4" rx="2" fill="url(#bar)"/>
    </g>
    <g class="card c3">
      <rect x="651" y="1" width="302" height="186" rx="22" fill="#0F0F1C" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="682" y="86" font-size="56" font-weight="800" fill="url(#num)" letter-spacing="-1">+50%</text>
      <text x="682" y="124" font-size="17" font-weight="600" fill="#FFFFFF">monthly active users</text>
      <text x="682" y="150" font-size="14" fill="#9A9AB5">EDET platform relaunch</text>
      <rect class="grow" x="682" y="166" width="120" height="4" rx="2" fill="url(#bar)"/>
    </g>
    <g class="card c4">
      <rect x="976" y="1" width="302" height="186" rx="22" fill="#0F0F1C" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="1007" y="86" font-size="56" font-weight="800" fill="url(#num)" letter-spacing="-1">500+</text>
      <text x="1007" y="124" font-size="17" font-weight="600" fill="#FFFFFF">users on DivZone AI</text>
      <text x="1007" y="150" font-size="14" fill="#9A9AB5">Built solo, prompt → live site</text>
      <rect class="grow" x="1007" y="166" width="120" height="4" rx="2" fill="url(#bar)"/>
    </g>
  </g>
</svg>
