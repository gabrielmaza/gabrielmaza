<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" fill="none">
  <defs>
    <clipPath id="card"><rect width="1280" height="420" rx="28"/></clipPath>
    <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8E2DE2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8E2DE2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4A00E0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4A00E0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00D4FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#C9B6FF"/>
      <stop offset="1" stop-color="#5EE7FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E2DE2"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="winBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
      .sans { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      .fade { opacity: 0; animation: fadeUp .9s ease-out forwards; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .3s } .d3 { animation-delay: .5s }
      .d4 { animation-delay: .7s } .d5 { animation-delay: .9s }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: translateY(0) } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
      .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="#0A0A14"/>
    <circle cx="180" cy="80" r="320" fill="url(#blobA)">
      <animate attributeName="cx" values="180;320;180" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;160;80" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="380" r="360" fill="url(#blobB)">
      <animate attributeName="cx" values="1100;940;1100" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="40" r="260" fill="url(#blobC)">
      <animate attributeName="cy" values="40;120;40" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="760;860;760" dur="20s" repeatCount="indefinite"/>
    </circle>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <rect x="0.5" y="0.5" width="1279" height="419" rx="27.5" stroke="#FFFFFF" stroke-opacity="0.08"/>
  </g>

  <!-- Left: intro -->
  <g class="mono fade d1">
    <text x="72" y="108" font-size="18" fill="#8BE9FD">~/gabriel $ <tspan fill="#E2E2F0">whoami</tspan></text>
  </g>
  <g class="sans fade d2">
    <text x="70" y="186" font-size="72" font-weight="800" letter-spacing="-2" fill="url(#nameGrad)">Gabriel Maza</text>
  </g>
  <g class="sans fade d3">
    <text x="72" y="232" font-size="26" font-weight="600" fill="#FFFFFF">Senior Frontend Engineer</text>
    <text x="72" y="268" font-size="19" fill="#B9B9D0">React · Next.js · TypeScript · AI-native development</text>
  </g>
  <rect class="fade d3" x="72" y="290" width="120" height="4" rx="2" fill="url(#accent)"/>

  <!-- chips -->
  <g class="sans fade d4" font-size="15" font-weight="600">
    <rect x="72" y="320" width="196" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="94" cy="339" r="5" fill="#50FA7B" class="pulse"/>
    <text x="108" y="344" fill="#E2E2F0">Tucumán, Argentina</text>

    <rect x="280" y="320" width="150" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="302" cy="339" r="5" fill="#8BE9FD"/>
    <text x="316" y="344" fill="#E2E2F0">Remote-first</text>

    <rect x="442" y="320" width="164" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="464" cy="339" r="5" fill="#BD93F9"/>
    <text x="478" y="344" fill="#E2E2F0">10+ years · EN C1</text>
  </g>

  <!-- Right: code window -->
  <g class="fade d5">
    <g class="float">
      <rect x="726" y="72" width="490" height="290" rx="18" fill="#12121F" fill-opacity="0.82" stroke="url(#winBorder)"/>
      <rect x="726" y="72" width="490" height="44" rx="18" fill="#FFFFFF" fill-opacity="0.04"/>
      <circle cx="752" cy="94" r="6" fill="#FF5F57"/>
      <circle cx="774" cy="94" r="6" fill="#FEBC2E"/>
      <circle cx="796" cy="94" r="6" fill="#28C840"/>
      <text x="971" y="99" text-anchor="middle" class="mono" font-size="13" fill="#7A7A99">gabriel.ts</text>

      <g class="mono" font-size="16">
        <text x="754" y="152"><tspan fill="#FF79C6">const</tspan><tspan fill="#E2E2F0"> gabriel </tspan><tspan fill="#FF79C6">=</tspan><tspan fill="#E2E2F0"> {</tspan></text>
        <text x="778" y="182"><tspan fill="#8BE9FD">role</tspan><tspan fill="#E2E2F0">: </tspan><tspan fill="#F1FA8C">"Senior Frontend Engineer"</tspan><tspan fill="#E2E2F0">,</tspan></text>
        <text x="778" y="212"><tspan fill="#8BE9FD">stack</tspan><tspan fill="#E2E2F0">: [</tspan><tspan fill="#F1FA8C">"React"</tspan><tspan fill="#E2E2F0">, </tspan><tspan fill="#F1FA8C">"Next.js"</tspan><tspan fill="#E2E2F0">, </tspan><tspan fill="#F1FA8C">"TS"</tspan><tspan fill="#E2E2F0">],</tspan></text>
        <text x="778" y="242"><tspan fill="#8BE9FD">shipped</tspan><tspan fill="#E2E2F0">: [</tspan><tspan fill="#F1FA8C">"NFL.com"</tspan><tspan fill="#E2E2F0">, </tspan><tspan fill="#F1FA8C">"VIX"</tspan><tspan fill="#E2E2F0">, </tspan><tspan fill="#F1FA8C">"div.zone"</tspan><tspan fill="#E2E2F0">],</tspan></text>
        <text x="778" y="272"><tspan fill="#8BE9FD">background</tspan><tspan fill="#E2E2F0">: </tspan><tspan fill="#F1FA8C">"Industrial Design"</tspan><tspan fill="#E2E2F0">,</tspan></text>
        <text x="778" y="302"><tspan fill="#8BE9FD">aiNative</tspan><tspan fill="#E2E2F0">: </tspan><tspan fill="#BD93F9">true</tspan><tspan fill="#E2E2F0">,</tspan></text>
        <text x="754" y="332"><tspan fill="#E2E2F0">};</tspan></text>
        <rect class="cursor" x="778" y="318" width="10" height="18" fill="#8BE9FD"/>
      </g>
    </g>
  </g>
</svg>
